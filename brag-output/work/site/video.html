<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fluxcase Kickstarter</title>
<style>
  @font-face { font-family: Archivo; font-weight: 800; font-stretch: 125%; src: url(fonts/archivo-800.ttf); font-display: block; }
  @font-face { font-family: Archivo; font-weight: 900; font-stretch: 125%; src: url(fonts/archivo-900.ttf); font-display: block; }
  @font-face { font-family: JBM; font-weight: 500; src: url(fonts/JetBrainsMono-Medium.ttf); font-display: block; }
  @font-face { font-family: JBM; font-weight: 700; src: url(fonts/JetBrainsMono-Bold.ttf); font-display: block; }
  :root { --ink: #111413; --bg: #F3F4F2; --grey: #E2E2E2; --teal: #74CABF; --deep: #1D6B62; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--grey); }
  #stage { position: absolute; inset: 0; }
  canvas { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .t { position: absolute; color: var(--ink); white-space: nowrap; will-change: transform, opacity; }
  .h { font-family: Archivo; font-weight: 900; font-stretch: 125%; letter-spacing: -0.01em; line-height: 0.98; }
  .s { font-family: Archivo; font-weight: 800; font-stretch: 125%; line-height: 1.12; }
  .m { font-family: JBM; font-weight: 700; letter-spacing: 0.02em; }
  .w { display: inline-block; }
  .label { position: absolute; transform: translateX(-50%); font-family: JBM; font-weight: 700; font-size: 27px; color: var(--ink); white-space: nowrap; }
  .label i { display: block; width: 100%; height: 3px; background: var(--ink); margin-bottom: 12px; font-style: normal; }
  #rule { position: absolute; height: 6px; background: var(--ink); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>

  <div id="hook" class="t h" style="left:120px; top:640px; font-size:120px">It closes<br>itself.</div>

  <div id="mark" class="t h" style="left:120px; top:350px; font-size:146px">FLUXCASE</div>
  <div id="rule" style="left:124px; top:516px; width:0"></div>
  <div id="sub" class="t s" style="left:120px; top:560px; font-size:50px">Magnetic vial cases<br>for 3 mL and 10 mL vials.</div>

  <div id="mag1" class="t s" style="left:120px; top:118px; font-size:62px">Ring magnets in<br>the base and lid.</div>
  <div id="mag2" class="t h" style="left:120px; top:282px; font-size:96px">No clips.</div>

  <div id="five" class="t h" style="left:120px; top:110px; font-size:112px">Five sizes.</div>
  <div id="labels"></div>

  <div id="col1" class="t h" style="left:120px; top:118px; font-size:112px">Pulls shut.<br>Holds shut.</div>
  <div id="col2" class="t m" style="left:124px; top:368px; font-size:24px">Black PETG. 3D printed to order in Texas.</div>

  <div id="ks1" class="t h" style="left:120px; top:104px; font-size:124px">Kickstarter.</div>
  <div id="ks2" class="t h" style="left:120px; top:232px; font-size:124px">November 1, 2026.</div>
  <div id="ks3" class="t m" style="left:124px; top:396px; font-size:30px">Fluxcase by The 3D Print Depot</div>
</div>

<script type="module">
import * as THREE from './vendor/three.module.js';
import { RoomEnvironment } from './vendor/RoomEnvironment.js';
import { toCreasedNormals } from './vendor/BufferGeometryUtils.js';

const W = 1920, H = 1080;
const MESH = new URLSearchParams(location.search).get('mesh') || 'mesh';

// ---------- timing helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;   // easeInOutCubic
const eo = k => 1 - Math.pow(1 - k, 3);                                      // easeOutCubic
const eo5 = k => 1 - Math.pow(1 - k, 5);
const ei = k => k * k;
const backOut = k => { const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };

// ---------- renderer ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.85;

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-220, 420, 260);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 6;
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.6;
Object.assign(key.shadow.camera, { left: -320, right: 320, top: 320, bottom: -320, near: 50, far: 1200 });
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xffffff, 0.9);
rim.position.set(300, 200, -300);
scene.add(rim);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.ShadowMaterial({ opacity: 0.16 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const camera = new THREE.PerspectiveCamera(30, W / H, 5, 5000);

// ---------- CAD ----------
const CASES = {
  c12: { name: '12-Vial-3mL', label: '12-Vial 3 mL' },
  c6:  { name: '6-Vial-3mL',  label: '6-Vial 3 mL' },
  c4:  { name: '4-Vial-10mL', label: '4-Vial 10 mL' },
  c8:  { name: '8-Vial-10mL', label: '8-Vial 10 mL' },
  c7:  { name: '7-Vial-Mixed', label: '7-Vial Mixed' },
};
const ORDER = ['c12', 'c6', 'c4', 'c8', 'c7'];

async function loadPart(entry) {
  const buf = await (await fetch(`${MESH}/${entry.bin}`)).arrayBuffer();
  const pos = new Float32Array(buf, 0, entry.verts * 3);
  const idx = new Uint32Array(buf, entry.verts * 12, entry.tris * 3);
  let g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g = toCreasedNormals(g, THREE.MathUtils.degToRad(32));
  return g;
}

const magnetMat = new THREE.MeshStandardMaterial({ color: 0xC8CBCE, metalness: 1, roughness: 0.2, emissive: 0xffffff, emissiveIntensity: 0 });

function plastic(hex) {
  return new THREE.MeshPhysicalMaterial({ color: hex, roughness: 0.42, metalness: 0, clearcoat: 0.18, clearcoatRoughness: 0.45 });
}

// One instance of a case. CAD space is Z-up; `root` is Y-up world space.
function makeCase(parts) {
  const { base, baseMag, lid, lidMag } = parts;
  const bb = base.entry, lb = lid.entry;
  const cx = (bb.min[0] + bb.max[0]) / 2, cy = (bb.min[1] + bb.max[1]) / 2;
  const lcx = (lb.min[0] + lb.max[0]) / 2, lcy = (lb.min[1] + lb.max[1]) / 2;
  const baseH = bb.max[2], lidH = lb.max[2];

  const root = new THREE.Group();
  const cad = new THREE.Group();
  cad.rotation.x = -Math.PI / 2;
  root.add(cad);

  const mat = plastic(0x74CABF);
  const mk = (g, m) => { const o = new THREE.Mesh(g, m); o.castShadow = true; o.receiveShadow = true; return o; };

  const baseMesh = mk(base.geo, mat);
  baseMesh.position.set(-cx, -cy, 0);
  const baseMagGrp = new THREE.Group();
  const bm = mk(baseMag.geo, magnetMat);
  bm.position.set(-cx, -cy, 0);
  baseMagGrp.add(bm);
  cad.add(baseMesh, baseMagGrp);

  // Lid is printed upside down (z=0 is the outer top) and mirrored in Y on the plate.
  // Flip 180 deg about X: (x,y,z) -> (x,-y,-z), then shift so the lid's open face sits on the base.
  const lidPivot = new THREE.Group();          // origin: lid centre, half way up the lid
  const lidInner = new THREE.Group();
  lidInner.rotation.x = Math.PI;
  lidInner.position.set(-lcx, lcy, lidH / 2);
  const lidMesh = mk(lid.geo, mat);
  const lidMagGrp = new THREE.Group();
  lidMagGrp.add(mk(lidMag.geo, magnetMat));
  lidInner.add(lidMesh, lidMagGrp);
  lidPivot.add(lidInner);
  cad.add(lidPivot);

  const c = { root, mat, baseH, lidH, dia: bb.max[0] - bb.min[0] };
  c.set = ({ lift = 0, tiltX = 0, tiltZ = 0, back = 0, magOut = 0, color } = {}) => {
    lidPivot.position.set(0, back, baseH + lidH / 2 + lift);
    lidPivot.rotation.set(tiltX, 0, tiltZ);
    baseMagGrp.position.z = magOut;
    lidMagGrp.position.z = magOut;           // lid print +z points toward its open face
    if (color !== undefined) mat.color.set(color);
  };
  c.set();
  return c;
}

const manifest = await (await fetch(`${MESH}/manifest.json`)).json();
const geos = {};
await Promise.all(manifest.map(async e => { geos[e.name] = { entry: e, geo: await loadPart(e) }; }));
function partsFor(k) {
  const n = CASES[k].name;
  const find = suffix => geos[Object.keys(geos).find(x => x.startsWith(n + ' ' + suffix))];
  return { base: geos[n + ' base'], lid: geos[n + ' lid'], baseMag: find('base magnets'), lidMag: find('lid magnets') };
}

// Instances: hero cases + a row of five.
const hero12 = makeCase(partsFor('c12'));
const hero8 = makeCase(partsFor('c8'));
const hero7 = makeCase(partsFor('c7'));
const row = ORDER.map(k => makeCase(partsFor(k)));
const all = [hero12, hero8, hero7, ...row];
all.forEach(c => scene.add(c.root));

// Row layout along X, centred.
const GAP = 44;
const rowW = row.reduce((s, c) => s + c.dia, 0) + GAP * (row.length - 1);
let acc = -rowW / 2;
const rowX = row.map(c => { const x = acc + c.dia / 2; acc += c.dia + GAP; return x; });

// ---------- colors ----------
// Fluxcase is printed in black PETG only. Magnets are always silver.
const COL = { black: '#1E1F21' };

// Labels for the row of five.
const labelsEl = document.getElementById('labels');
const labels = ORDER.map(k => {
  const d = document.createElement('div');
  d.className = 'label';
  d.innerHTML = `<i></i>${CASES[k].label}`;
  labelsEl.appendChild(d);
  return d;
});

// ---------- text ----------
// Split headline text into words that rise in, staggered.
function wordify(id) {
  const el = document.getElementById(id);
  const parts = el.innerHTML.split(/(<br>)/);
  el.innerHTML = parts.map(p => p === '<br>' ? p : p.split(' ').map(w => `<span class="w">${w}</span>`).join(' ')).join('');
  return el;
}
const TXT = {};
['hook', 'mark', 'sub', 'mag1', 'mag2', 'five', 'col1', 'col2', 'ks1', 'ks2', 'ks3'].forEach(id => TXT[id] = wordify(id));

// Show text `id` from tIn to tOut (both on beats). Words rise in with 50 ms stagger.
function text(id, t, tIn, tOut) {
  const el = TXT[id];
  const on = t >= tIn && t < tOut;
  el.style.visibility = on ? 'visible' : 'hidden';
  if (!on) return;
  [...el.querySelectorAll('.w')].forEach((w, i) => {
    const k = eo5(seg(t, tIn + i * 0.05, tIn + i * 0.05 + 0.32));
    w.style.opacity = k;
    w.style.transform = `translateY(${(1 - k) * 46}px)`;
  });
}

// ---------- camera ----------
function look(pos, target, fov = 30, shiftPx = 0) {
  camera.fov = fov;
  camera.position.set(...pos);
  camera.lookAt(new THREE.Vector3(...target));
  // Negative offset pushes the subject right, leaving the left side for type.
  camera.setViewOffset(W, H, -shiftPx, 0, W, H);
  camera.updateProjectionMatrix();
}
const sph = (r, az, el, tgt = [0, 0, 0]) => {
  const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
  return [tgt[0] + r * Math.cos(e) * Math.sin(a), tgt[1] + r * Math.sin(e), tgt[2] + r * Math.cos(e) * Math.cos(a)];
};

function show(...on) { all.forEach(c => c.root.visible = on.includes(c)); }
function bg(hex) { renderer.setClearColor(hex, 1); document.body.style.background = hex; }

// ---------- the timeline ----------
// 120 BPM: beat 0.5 s, bar 2 s. Cuts at 2, 5, 9, 13, 16.
function renderAt(t) {
  labels.forEach(l => l.style.visibility = 'hidden');
  document.getElementById('rule').style.width = '0';
  magnetMat.emissiveIntensity = 0;

  if (t < 5) {
    // HOOK + REVEAL: the 12-vial.
    bg('#E2E2E2');
    show(hero12);
    hero12.root.position.set(0, 0, 0);
    hero12.root.rotation.y = THREE.MathUtils.degToRad(-18 + t * 3);
    let gap;
    if (t < 1.2) gap = lerp(34, 9, eo(seg(t, 0, 1.2)));               // drifts down
    else if (t < 1.5) gap = lerp(9, 0, ei(seg(t, 1.2, 1.5)));          // magnets take it
    else gap = Math.max(0, Math.sin(seg(t, 1.5, 1.72) * Math.PI) * 1.1); // tiny rebound
    const tilt = t < 1.5 ? (1 - seg(t, 0, 1.5)) * 0.05 : 0;
    hero12.set({ lift: gap, tiltX: tilt, color: COL.black });

    if (t < 2) {
      const k = seg(t, 0, 2);
      look(sph(lerp(300, 270, k), -8, 14, [0, 40, 0]), [0, 40, 0], 30, 440);
    } else {
      const k = eio(seg(t, 2, 3.2));
      const r = lerp(270, 470, k), el = lerp(14, 26, k), az = lerp(-8, 12, eo(seg(t, 2, 5)));
      const ty = lerp(40, 28, k);
      look(sph(r, az, el, [0, ty, 0]), [0, ty, 0], 30, lerp(440, 500, k));
    }
    text('hook', t, 0.0, 2.0);
    text('mark', t, 2.0, 5.0);
    text('sub', t, 2.5, 5.0);
    if (t >= 2) document.getElementById('rule').style.width = `${eo(seg(t, 2.2, 2.7)) * 340}px`;
  } else if (t < 9) {
    // HOW IT STAYS SHUT: 8-vial in black, lid lifts back and opens, magnets light up.
    bg('#E2E2E2');
    show(hero8);
    hero8.root.position.set(0, 0, 0);
    hero8.root.rotation.y = THREE.MathUtils.degToRad(-22 + (t - 5) * 4);
    const k = eio(seg(t, 5.0, 6.0));
    const out = backOut(seg(t, 6.5, 7.0)) * 3.2;                      // magnets rise on beat
    hero8.set({ lift: k * 46, back: k * 52, tiltX: -k * 1.95, magOut: out, color: COL.black });
    const flash = Math.max(0, 1 - seg(t, 6.5, 7.1)) * (t >= 6.5 ? 1 : 0);
    magnetMat.emissiveIntensity = flash * 0.55;
    const cam = eio(seg(t, 5, 9));
    look(sph(lerp(560, 520, cam), lerp(-6, 8, cam), lerp(28, 36, cam), [0, 72, 10]), [0, 72, 10], 30, 420);
    text('mag1', t, 5.5, 9.0);
    text('mag2', t, 7.0, 9.0);
  } else if (t < 13) {
    // FIVE SIZES: bases land one per beat.
    bg('#E2E2E2');
    show(...row);
    row.forEach((c, i) => {
      const land = 9.5 + i * 0.5;
      const k = eo5(seg(t, land - 0.45, land));
      c.root.visible = t >= land - 0.45;
      c.root.position.set(rowX[i] + (1 - k) * 700, 0, 0);
      c.root.rotation.y = THREE.MathUtils.degToRad(-10);
      c.set({ color: COL.black });
    });
    const cam = eio(seg(t, 9, 13));
    const tgt = [0, 42, 0];
    look(sph(lerp(760, 720, cam), lerp(-4, 3, cam), 19, tgt), tgt, 30, 0);
    camera.updateMatrixWorld();
    row.forEach((c, i) => {
      const land = 9.5 + i * 0.5;
      if (t < land) return;
      const p = new THREE.Vector3(rowX[i], 0, c.dia / 2 + 10).project(camera);
      const l = labels[i];
      l.style.visibility = 'visible';
      const k = eo5(seg(t, land, land + 0.3));
      l.style.left = `${(p.x * 0.5 + 0.5) * W}px`;
      l.style.top = `${(-p.y * 0.5 + 0.5) * H + 34 + (1 - k) * 20}px`;
      l.style.opacity = k;
    });
    text('five', t, 9.0, 13.0);
  } else if (t < 16) {
    // PULLS SHUT: black 7-vial, lid swings back down and the magnets take it on beat (14.5 s).
    bg('#E2E2E2');
    show(hero7);
    hero7.root.position.set(0, 0, 0);
    hero7.root.rotation.y = THREE.MathUtils.degToRad(-28 + (t - 13) * 5);
    const k = eio(seg(t, 13.0, 14.3));
    let lift = lerp(46, 9, k), back = lerp(52, 0, k), tiltX = lerp(-1.95, 0, k);
    if (t >= 14.3 && t < 14.5) lift = lerp(9, 0, ei(seg(t, 14.3, 14.5)));
    else if (t >= 14.5) lift = Math.max(0, Math.sin(seg(t, 14.5, 14.72) * Math.PI) * 1.1);
    hero7.set({ lift, back, tiltX, magOut: 0, color: COL.black });
    const cam = eio(seg(t, 13, 16));
    look(sph(lerp(470, 430, cam), lerp(6, -4, cam), lerp(30, 20, cam), [0, 60, 10]), [0, 60, 10], 30, 420);
    text('col1', t, 13.0, 16.0);
    text('col2', t, 13.5, 16.0);
  } else {
    // OUTRO: the row, closed. Launch date.
    bg('#F3F4F2');
    show(...row);
    row.forEach((c, i) => {
      c.root.visible = true;
      const k = eo5(seg(t, 16 + i * 0.06, 16.5 + i * 0.06));
      c.root.position.set(rowX[i], 0, (1 - k) * 0);
      c.root.rotation.y = THREE.MathUtils.degToRad(-10 + 6 * eio(seg(t, 16, 20)));
      c.set({ color: COL.black });
    });
    const cam = eio(seg(t, 16, 20));
    const tgt = [0, 118, 0];
    look(sph(lerp(800, 760, cam), 0, 15, tgt), tgt, 30, 0);
    text('ks1', t, 16.0, 99);
    text('ks2', t, 16.5, 99);
    text('ks3', t, 17.0, 99);
  }
  renderer.render(scene, camera);
}

// Hide everything not active this frame, then draw.
const ALL_TEXT = Object.keys(TXT);
window.renderAt = t => {
  ALL_TEXT.forEach(id => TXT[id].style.visibility = 'hidden');
  renderAt(t);
};

await document.fonts.load('900 40px Archivo');
await document.fonts.load('800 40px Archivo');
await document.fonts.load('700 20px JBM');
await document.fonts.ready;
// Compile all materials once so the first captured frame is not different.
renderer.compile(scene, camera);
window.renderAt(Number(new URLSearchParams(location.search).get('t') || 0));
window.__ready = true;
</script>
</body>
</html>
