<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Fluxcase Instagram ads</title>
<style>
  @font-face { font-family: Archivo; font-weight: 800; font-stretch: 125%; src: url(fonts/archivo-800.ttf); font-display: block; }
  @font-face { font-family: Archivo; font-weight: 900; font-stretch: 125%; src: url(fonts/archivo-900.ttf); font-display: block; }
  @font-face { font-family: JBM; font-weight: 700; src: url(fonts/JetBrainsMono-Bold.ttf); font-display: block; }
  html, body { margin: 0; overflow: hidden; }
  canvas { position: absolute; left: 0; top: 0; }
  #top { position: absolute; left: 64px; right: 64px; display: flex; flex-direction: column; }
  .h { font-family: Archivo; font-weight: 900; font-stretch: 125%; letter-spacing: -0.01em; line-height: 0.98; }
  .s { font-family: Archivo; font-weight: 800; font-stretch: 125%; line-height: 1.1; }
  .acc { color: var(--acc); }
  .rule { width: 150px; height: 6px; background: var(--acc); }
  #foot { position: absolute; left: 64px; right: 64px; display: flex; justify-content: space-between; align-items: baseline; }
  #foot .ask { font-family: Archivo; font-weight: 800; font-stretch: 125%; font-size: 32px; }
  .fine { font-family: JBM; font-weight: 700; font-size: 22px; }
  .kick { font-family: Archivo; font-weight: 800; font-stretch: 125%; }
  .label { position: absolute; transform: translateX(-50%); font-family: JBM; font-weight: 700; font-size: 23px; white-space: nowrap; text-align: center; }
  .label i { display: block; height: 3px; background: currentColor; margin: 0 auto 10px; width: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script type="module">
// Fluxcase static ads: ads.html?n=<1..30>. Each ad is a spec below; layout is automatic:
// the launch end card's header (wordmark, teal rule, headline, one line) at the top, a small print
// line at the bottom, and the camera fits the product into the space between.
const N = Number(new URLSearchParams(location.search).get('n') || 1);

const THEMES = {
  light: { bg: '#F3F4F2', ink: '#111413', acc: '#1D6B62' },
  grey:  { bg: '#E2E2E2', ink: '#111413', acc: '#1D6B62' },
};
const SIZES = { feed: [1080, 1350], square: [1080, 1080], story: [1080, 1920] };
const ASK = 'Back it on <span class="acc">Kickstarter.</span> Nov 1, 2026.';
const MADE = 'Black PETG. Printed in Texas.';
const LAUNCH = 'Launching November 1, 2026.';

// ---------- the 30 ads ----------
// head: headline (\n = line break, *word* = the one teal accent); line: the second line under it;
// scene: what is shown. Launch ads put the date in `line`, so they drop the small date at the bottom.
const ADS = [
  { head: 'It closes\n*itself.*', line: 'Ring magnets pull the lid shut.', scene: ['hover', 'c12'] },
  { head: 'Magnetic\n*vial cases.*', line: 'For 3 mL and 10 mL vials.', scene: ['closed', 'c12'] },
  { head: 'Ring *magnets*\nin the base\nand lid.', size: 80, scene: ['open', 'c8', { vials: true }] },
  { head: 'No *clips.*', line: 'Ring magnets pull it shut\nand hold it there.', scene: ['open', 'c8', { magOut: 10 }], theme: 'grey' },
  { head: 'Held shut\nby *magnets.*', line: 'Ring magnets in the base and lid.', scene: ['tipped', 'c7'] },
  { head: '*Five* sizes.', line: 'For 3 mL and 10 mL vials.', scene: ['grid'] },
  { head: '3 mL. 10 mL.\n*Mixed.*', scene: ['grid'], theme: 'grey' },
  { head: '*12 vials.*\n3 mL.', line: 'Ring magnets in the base and lid.', scene: ['open', 'c12'] },
  { head: '*6 vials.*\n3 mL.', line: 'No clips. Magnets pull it shut.', scene: ['open', 'c6'], theme: 'grey' },
  { head: '*4 vials.*\n10 mL.', line: 'No friction-fit lid.', scene: ['open', 'c4'] },
  { head: '*8 vials.*\n10 mL.', line: 'Ring magnets hold the lid shut.', scene: ['open', 'c8', { vials: true }], theme: 'grey' },
  { head: '3 mL *and*\n10 mL in\none case.', size: 84, line: '7-Vial Mixed', scene: ['open', 'c7', { vials: true }] },
  { head: 'Back it on\n*Kickstarter.*', line: LAUNCH, scene: ['pair'], launch: true },
  { head: 'Back it on\n*Kickstarter.*', line: LAUNCH, scene: ['bleed'], launch: true },
  { head: 'One well\nper *vial.*', line: 'For 3 mL and 10 mL vials.', scene: ['top', 'c7', { vials: true }], theme: 'grey' },
  { head: 'Silver *ring*\n*magnets.*', line: 'Set into the base and the lid.', scene: ['macro', 'c8'] },
  { head: 'Pulls shut.\n*Holds shut.*', scene: ['hover', 'c4'], theme: 'grey' },
  { head: 'No clips.\nNo *friction lid.*', size: 84, line: 'The magnets do the work.', scene: ['closed', 'c8'] },
  { head: 'Black *PETG.*', line: '3D printed to order in Texas.', scene: ['closed', 'c7'], theme: 'grey' },
  { head: 'Printed to order\nin *Texas.*', size: 84, line: 'Black PETG.', scene: ['closed', 'c4', { el: 12 }] },
  { head: 'Back it on\n*Kickstarter.*', line: LAUNCH, scene: ['bleed'], fmt: 'square', launch: true },
  { head: 'Back it on\n*Kickstarter.*', line: LAUNCH, scene: ['pair'], fmt: 'story', launch: true },
  { head: 'It closes\n*itself.*', line: 'Ring magnets pull it shut.', scene: ['open', 'c8', { vials: true }], fmt: 'story' },
  { head: 'Drop the lid.\nThe magnets\n*close it.*', size: 76, scene: ['hover', 'c6'], fmt: 'square', theme: 'grey' },
  { head: 'Closed.\n*Open.*', line: 'Ring magnets pull it shut.', scene: ['pair'] },
  { head: 'Magnets in.\n*Clips out.*', scene: ['open', 'c12', { magOut: 8 }], theme: 'grey' },
  { head: '*Kickstarter.*\nNov 1.', line: 'Five magnetic vial cases.', scene: ['grid'], launch: true },
  { head: 'Closes on\nits *own.*', line: 'Set the lid close. The magnets\npull it shut.', size: 88, scene: ['closed', 'c6', { el: 10 }] },
  { head: '3 mL and\n*10 mL vials.*', line: 'Five sizes. All black PETG.', scene: ['top', 'c8', { vials: true }], theme: 'grey' },
  { head: 'Five *magnetic*\nvial cases.', size: 84, line: LAUNCH, scene: ['bleed'], fmt: 'story', launch: true },
];

const ad = ADS[N - 1];
const T = THEMES[ad.theme || 'light'];
const [W, H] = SIZES[ad.fmt || 'feed'];
window.STAGE = { W, H };
document.body.style.cssText = `width:${W}px; height:${H}px; background:${T.bg}; color:${T.ink}; --acc:${T.acc}`;
const cv = document.getElementById('c');
cv.width = W; cv.height = H; cv.style.width = W + 'px'; cv.style.height = H + 'px';

const E = await import('./engine.js');
const { THREE, scene, camera, makeCase, partsFor, CASES, ORDER, COL, render } = E;
const deg = THREE.MathUtils.degToRad;

// ---------- copy: the end card's header ----------
const fmt = ad.fmt || 'feed';
const story = fmt === 'story', square = fmt === 'square';
const ui = document.getElementById('ui');
const top = document.createElement('div');
top.id = 'top';
top.style.top = (story ? 250 : square ? 60 : 72) + 'px';
const size = ad.size || (story ? 104 : square ? 84 : 92);
const markSize = Math.round(size * 0.62);
const acc = t => t.replace(/\*(.+?)\*/g, '<span class="acc">$1</span>');
top.innerHTML =
  `<div style="display:flex; justify-content:space-between; align-items:baseline"><div class="h" style="font-size:${markSize}px">FLUXCASE</div>` +
  `<div class="kick" style="font-size:${Math.round(markSize * 0.46)}px">Magnetic vial cases</div></div>` +
  `<div class="rule" style="margin:${Math.round(markSize * 0.28)}px 0 ${Math.round(size * 0.36)}px"></div>` +
  `<div class="h" style="font-size:${size}px">${acc(ad.head).split('\n').join('<br>')}</div>` +
  (ad.line ? `<div class="s" style="font-size:${Math.round(size * 0.5)}px; margin-top:${Math.round(size * 0.24)}px">${ad.line.split('\n').join('<br>')}</div>` : '');
ui.appendChild(top);

// Small print: the launch date (unless the line already carries it) and the vials note.
const [kind, k, opt = {}] = ad.scene;
const vials = !!opt.vials || kind === 'pair';
const footY = story ? H - 330 - 70 : H - 80;   // stories: clear of Instagram's bottom 330 px
const foot = document.createElement('div');
foot.id = 'foot';
foot.style.top = footY + 'px';
foot.innerHTML = `<span class="ask">${ad.launch ? MADE : ASK}</span>`;
if (vials) {
  const note = document.createElement('div');
  note.className = 'fine'; note.textContent = 'Vials not included.';
  note.style.cssText = `position:absolute; left:64px; top:${footY - 38}px`;
  ui.appendChild(note);
}
ui.appendChild(foot);

await document.fonts.load('900 40px Archivo');
await document.fonts.load('800 40px Archivo');
await document.fonts.load('700 20px JBM');
await document.fonts.ready;

// The product fills the space between the copy and the small print.
const region = {
  top: top.getBoundingClientRect().bottom + 48,
  bottom: footY - (vials ? 84 : 52),
  left: 64, right: W - 64,
};

// ---------- scenes ----------
const add = (k, opts) => { const c = makeCase(partsFor(k), opts); scene.add(c.root); c.set({ color: COL.black }); return c; };
const OPEN = { lift: 62, back: 58, tiltX: -1.62 };          // lid swung back, inner face toward camera

// Fit the camera so every non-shadow mesh of `objs` fills the region; az/el in degrees.
function fit(objs, az, el, fov = 30, fill = 0.9) {
  const box = new THREE.Box3();
  objs.forEach(o => o.traverse(m => {
    let shown = true; for (let q = m; q; q = q.parent) if (!q.visible) shown = false;
    if (m.isMesh && shown && !m.userData.noFit) {
      m.updateWorldMatrix(true, false);
      box.union(new THREE.Box3().setFromObject(m, true));
    }
  }));
  const ctr = box.getCenter(new THREE.Vector3());
  const pts = [];
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) pts.push(new THREE.Vector3(x, y, z));
  const rw = (region.right - region.left) * fill, rh = (region.bottom - region.top) * fill;
  const a = deg(az), e = deg(el);
  const dir = new THREE.Vector3(Math.cos(e) * Math.sin(a), Math.sin(e), Math.cos(e) * Math.cos(a));
  camera.fov = fov; camera.aspect = W / H; camera.clearViewOffset();
  let d = 400, ext;
  for (let i = 0; i < 8; i++) {
    camera.position.copy(ctr).addScaledVector(dir, d);
    camera.lookAt(ctr); camera.updateProjectionMatrix(); camera.updateMatrixWorld();
    const p = pts.map(q => q.clone().project(camera));
    ext = { x0: Math.min(...p.map(q => q.x)), x1: Math.max(...p.map(q => q.x)), y0: Math.min(...p.map(q => q.y)), y1: Math.max(...p.map(q => q.y)) };
    const pw = (ext.x1 - ext.x0) / 2 * W, ph = (ext.y1 - ext.y0) / 2 * H;
    d *= Math.max(pw / rw, ph / rh);
  }
  // Shift so the projected box centre lands on the region centre.
  const cx = ((ext.x0 + ext.x1) / 4 + 0.5) * W, cy = (0.5 - (ext.y0 + ext.y1) / 4) * H;
  const tx = (region.left + region.right) / 2, ty = (region.top + region.bottom) / 2;
  camera.setViewOffset(W, H, cx - tx, cy - ty, W, H);
  camera.updateProjectionMatrix();
}

function rowOf(keys, gap, z = 0) {
  const cs = keys.map(k => add(k));
  const w = cs.reduce((s, c) => s + c.dia, 0) + gap * (cs.length - 1);
  let x = -w / 2;
  cs.forEach(c => { c.root.position.set(x + c.dia / 2, 0, z); c.root.rotation.y = deg(-10); x += c.dia + gap; });
  return cs;
}
function labelUnder(c, k, baseY) {
  const v = new THREE.Vector3(c.root.position.x, 0, c.root.position.z + c.dia / 2 + 8).project(camera);
  v.y = -baseY;
  const d = document.createElement('div');
  d.className = 'label'; d.innerHTML = `<i></i>${CASES[k].label}`;
  d.style.left = `${(v.x * .5 + .5) * W}px`; d.style.top = `${(-v.y * .5 + .5) * H + 16}px`;
  ui.appendChild(d);
}

const SCENES = {
  closed() { const c = add(k); c.root.rotation.y = deg(-16); fit([c.root], -6, opt.el ?? 22); },
  hover() { const c = add(k); c.root.rotation.y = deg(-14); c.set({ lift: 9, tiltX: 0.03, color: COL.black }); fit([c.root], -8, 18); },
  open() {
    const c = add(k, { vials: !!opt.vials });
    c.root.rotation.y = deg(-12);
    c.set({ ...OPEN, magOut: opt.magOut || 0, vialLift: opt.vials ? 20 : 0, color: COL.black });
    fit([c.root], -2, 32);
  },
  top() {   // lid off to the side, looking down into the wells
    const c = add(k, { vials: !!opt.vials });
    c.lid.visible = false;
    c.root.rotation.y = deg(-8);
    fit([c.root], -4, 36, 30, 0.9);
  },
  macro() { // close on the silver rings in the base, lid swung back out of frame
    const c = add(k);
    c.set({ ...OPEN, magOut: 4, color: COL.black });
    c.lid.visible = false;
    c.root.rotation.y = deg(-12);
    fit([c.root], -4, 48, 24, 0.98);
  },
  tipped() { // on its side, lid held shut by the magnets
    const c = add(k);
    const R = c.dia / 2, tip = deg(90);
    c.mat.clearcoat = 0; c.mat.roughness = 0.55;
    c.root.rotation.order = 'ZYX';
    c.root.rotation.set(0, deg(-24), -tip);
    c.root.position.set(R, R, 0);
    c.root.updateMatrixWorld(true);
    const mid = c.root.localToWorld(new THREE.Vector3(0, (c.baseH + c.lidH) / 2, 0));
    c.contact.position.copy(c.root.worldToLocal(new THREE.Vector3(mid.x, 0.05, mid.z)));
    c.contact.quaternion.copy(c.root.quaternion).invert().multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0)));
    fit([c.root], -6, 18, 30, 0.78);
  },
  lineup() { // the five on a diagonal, so the row fills a portrait frame
    const cs = rowOf(ORDER, 30);
    const a = deg(-38);
    cs.forEach(c => {
      const { x, z } = c.root.position;
      c.root.position.set(x * Math.cos(a) + z * Math.sin(a), 0, -x * Math.sin(a) + z * Math.cos(a));
      c.root.rotation.y = deg(-14);
    });
    fit(cs.map(c => c.root), -4, 24, 24, 0.94);
  },
  bleed() { // the launch end card's row: big, running off the right edge
    const cs = rowOf(ORDER, 44);
    cs.forEach(c => c.root.rotation.y = deg(-10));
    fit(cs.slice(0, story ? 2 : 3).map(c => c.root), 0, 17, 22, 1.08);
  },
  grid() {
    const back = rowOf(['c12', 'c6', 'c4'], 46, -150), front = rowOf(['c8', 'c7'], 46, 150);
    const all = [...back, ...front];
    region.bottom -= 46;                       // room for the labels
    fit(all.map(c => c.root), 0, 40, 16, 0.9);
    camera.updateMatrixWorld();
    const KS = ['c12', 'c6', 'c4', 'c8', 'c7'];
    [back, front].forEach(rw => {
      const y = Math.max(...rw.map(c => -new THREE.Vector3(c.root.position.x, 0, c.root.position.z + c.dia / 2 + 8).project(camera).y));
      rw.forEach(c => labelUnder(c, KS[all.indexOf(c)], y));
    });
  },
  pair() {  // one closed, one open with vials
    const a = add('c12'); a.root.position.set(-62, 0, 20); a.root.rotation.y = deg(-16);
    const b = add('c8', { vials: true }); b.root.position.set(70, 0, -30); b.root.rotation.y = deg(-8);
    b.set({ ...OPEN, vialLift: 20, color: COL.black });
    fit([a.root, b.root], -6, 22);
  },
};
SCENES[kind]();
render(T.bg);
window.__ready = true;
</script>
</body>
</html>
